# dsh-roundtable-harness —— 本地调试 overlay（不进 profile）
#
# 用法（在 DSH 源码 checkout 里）：
#   pnpm dsh web --patch "/absolute/path/to/dsh-roundtable-harness/cordis.yml"
#
# 注意：patch 里的 name 必须以 ./ 开头才会相对本文件锚定，否则按包名解析；
# 源码 checkout 下插件源码是 TS，需要先 `pnpm build`，再把 name 指到 lib。
#
# 行说明：
#   roundtable —— 主入口，与 cordis.patch.yml 是同一行，只是换成相对路径。

- insert:
    - id: roundtable-harness
      name: './lib/index.js'
      config:
        exposeTools: true
        injectPromptSection: true
        promptOrder: 1
